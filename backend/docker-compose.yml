version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/school_attendance
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=school_attendance
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  postgres_data: